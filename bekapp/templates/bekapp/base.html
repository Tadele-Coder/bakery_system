{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Bakery Management System
        {% endblock %}
    </title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Global CSS -->
    <link
        rel="stylesheet"
        href="{% static 'bekapp/css/style.css' %}"
    >


    <!-- Navbar CSS -->
    <link
        rel="stylesheet"
        href="{% static 'bekapp/css/navbar.css' %}"
    >


    <!-- Footer CSS -->
    <link
        rel="stylesheet"
        href="{% static 'bekapp/css/footer.css' %}"
    >


    <!-- Page-specific CSS -->
    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <!-- Navbar -->
    {% include 'bekapp/includes/navbar.html' %}



    <!-- Main Content -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    {% include 'bekapp/includes/footer.html' %}


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Page-specific JavaScript -->
    {% block extra_js %}
    {% endblock %}

</body>

</html>
